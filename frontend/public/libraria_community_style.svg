<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Crimson Circular Backdrop (Exact Screenshot Match) -->
  <ellipse cx="230" cy="240" rx="140" ry="140" fill="#dc2626" fill-opacity="0.35" />
  <circle cx="230" cy="240" r="110" fill="#7f1d1d" fill-opacity="0.5" />

  <!-- Background Window / Frame -->
  <rect x="100" y="80" width="260" height="150" fill="#18181b" stroke="#ffffff" stroke-width="3" rx="4" />
  <line x1="230" y1="80" x2="230" y2="230" stroke="#ffffff" stroke-width="2" />
  <!-- Side window wings -->
  <polygon points="60,60 100,80 100,230 60,210" fill="#09090b" stroke="#ffffff" stroke-width="3" />
  <polygon points="400,60 360,80 360,230 400,210" fill="#09090b" stroke="#ffffff" stroke-width="3" />

  <!-- Window Doodles (Science & Tech Symbols) -->
  <!-- Bulb -->
  <circle cx="150" cy="110" r="8" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M 147 118 H 153 M 148 121 H 152" stroke="#ffffff" stroke-width="2" />
  <!-- Globe in window -->
  <circle cx="310" cy="160" r="28" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
  <ellipse cx="310" cy="160" rx="28" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <ellipse cx="310" cy="160" rx="10" ry="28" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <!-- Beaker -->
  <polygon points="210,130 200,160 220,160" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <!-- Formula text -->
  <text x="320" y="110" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">ρ = F/A</text>
  <!-- Microbe/Atom -->
  <circle cx="260" cy="130" r="10" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- Desk Console Structure -->
  <rect x="110" y="230" width="240" height="110" fill="#ffffff" stroke="#09090b" stroke-width="4" rx="12" />
  <rect x="125" y="245" width="210" height="80" fill="#18181b" stroke="#09090b" stroke-width="3" rx="6" />
  <!-- Shelved Books inside Desk -->
  <rect x="180" y="260" width="12" height="50" fill="#ffffff" stroke="#09090b" stroke-width="2" />
  <rect x="195" y="255" width="14" height="55" fill="#dc2626" stroke="#09090b" stroke-width="2" />
  <rect x="212" y="265" width="10" height="45" fill="#ffffff" stroke="#09090b" stroke-width="2" />
  <rect x="225" y="260" width="15" height="50" fill="#71717a" stroke="#09090b" stroke-width="2" />

  <!-- Globe on Left Desk -->
  <circle cx="140" cy="275" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
  <path d="M 140 260 V 290 M 126 275 H 154" stroke="#ffffff" stroke-width="1.5" />

  <!-- Stack of Books on Desk Left -->
  <rect x="100" y="195" width="60" height="12" fill="#ffffff" stroke="#09090b" stroke-width="3" rx="2" />
  <rect x="105" y="183" width="55" height="12" fill="#dc2626" stroke="#09090b" stroke-width="3" rx="2" />
  <rect x="110" y="171" width="50" height="12" fill="#ffffff" stroke="#09090b" stroke-width="3" rx="2" />

  <!-- Character Figure Sitting on Desk (Libraria Exact Match) -->
  <!-- Legs -->
  <path d="M 230 220 L 260 210 L 280 250 L 230 250 Z" fill="#71717a" stroke="#09090b" stroke-width="3" />
  <path d="M 240 250 L 230 300 M 260 250 L 265 295" stroke="#09090b" stroke-width="4" stroke-linecap="round" />

  <!-- Torso / Red Sweater -->
  <path d="M 170 170 C 160 200 180 220 220 220 L 210 160 Z" fill="#dc2626" stroke="#09090b" stroke-width="3" />

  <!-- Head & Hair -->
  <circle cx="185" cy="140" r="14" fill="#ffffff" stroke="#09090b" stroke-width="3" />
  <!-- Dark Hair -->
  <path d="M 170 140 C 170 120 195 120 195 140 C 190 130 175 130 170 140 Z" fill="#18181b" stroke="#09090b" stroke-width="2" />

  <!-- Reading Book in Hand -->
  <polygon points="195,175 220,165 240,175 220,185" fill="#ffffff" stroke="#09090b" stroke-width="2" />

  <!-- Plant on Right -->
  <path d="M 330 300 Q 350 250 345 200" stroke="#09090b" stroke-width="3" />
  <ellipse cx="325" cy="250" rx="14" ry="22" fill="#dc2626" stroke="#09090b" stroke-width="2.5" transform="rotate(-25 325 250)" />
  <ellipse cx="355" cy="220" rx="12" ry="20" fill="#dc2626" stroke="#09090b" stroke-width="2.5" transform="rotate(20 355 220)" />
  <ellipse cx="340" cy="190" rx="10" ry="18" fill="#dc2626" stroke="#09090b" stroke-width="2.5" transform="rotate(-10 340 190)" />

  <!-- Pot -->
  <polygon points="320,300 340,300 338,330 322,330" fill="#ffffff" stroke="#09090b" stroke-width="3" />
</svg>
