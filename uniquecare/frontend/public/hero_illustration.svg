<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <!-- Radial Red Glow Filters -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#dc2626" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Glow Backdrop -->
  <circle cx="300" cy="250" r="220" fill="url(#redGlow)" />

  <!-- Grid Pattern Circuit Lines -->
  <path d="M50 250 H 550 M 300 50 V 450 M 120 120 L 480 380 M 480 120 L 120 380" stroke="#dc2626" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 8" />

  <!-- Center Isometric Main Server / Workstation Platform -->
  <g filter="url(#shadow)">
    <!-- Base Platform -->
    <polygon points="300,100 480,190 300,280 120,190" fill="url(#cardGrad)" stroke="#27272a" stroke-width="2" />
    <polygon points="120,190 300,280 300,310 120,220" fill="#0c0c0e" stroke="#27272a" stroke-width="2" />
    <polygon points="480,190 300,280 300,310 480,220" fill="#121215" stroke="#27272a" stroke-width="2" />

    <!-- Server Rack Stack 1 -->
    <rect x="220" y="140" width="160" height="90" rx="8" fill="#18181b" stroke="#dc2626" stroke-width="2" />
    <!-- Server LED Indicators -->
    <circle cx="245" cy="165" r="5" fill="#4ade80" />
    <circle cx="265" cy="165" r="5" fill="#dc2626" />
    <circle cx="285" cy="165" r="5" fill="#facc15" />
    <rect x="310" y="160" width="50" height="10" rx="3" fill="#27272a" />
    
    <rect x="240" y="185" width="120" height="8" rx="2" fill="#27272a" />
    <rect x="240" y="200" width="80" height="8" rx="2" fill="#dc2626" opacity="0.8" />

    <!-- Floating Holographic QR Tag Badge -->
    <g transform="translate(360, 80)">
      <rect x="0" y="0" width="100" height="100" rx="16" fill="#09090b" stroke="#dc2626" stroke-width="2.5" />
      <!-- QR Pattern -->
      <rect x="15" y="15" width="28" height="28" rx="4" fill="#ffffff" />
      <rect x="21" y="21" width="16" height="16" rx="2" fill="#09090b" />
      <rect x="25" y="25" width="8" height="8" fill="#dc2626" />

      <rect x="57" y="15" width="28" height="28" rx="4" fill="#ffffff" />
      <rect x="63" y="21" width="16" height="16" rx="2" fill="#09090b" />
      <rect x="67" y="25" width="8" height="8" fill="#dc2626" />

      <rect x="15" y="57" width="28" height="28" rx="4" fill="#ffffff" />
      <rect x="21" y="63" width="16" height="16" rx="2" fill="#09090b" />
      <rect x="25" y="67" width="8" height="8" fill="#dc2626" />

      <rect x="57" y="57" width="12" height="12" fill="#dc2626" />
      <rect x="73" y="57" width="12" height="12" fill="#ffffff" />
      <rect x="57" y="73" width="28" height="12" fill="#dc2626" />
    </g>

    <!-- Floating Shield Badge Left -->
    <g transform="translate(130, 260)">
      <rect x="0" y="0" width="110" height="70" rx="12" fill="#121215" stroke="#27272a" stroke-width="2" />
      <path d="M 25 20 L 40 12 L 55 20 V 38 Q 40 52 25 38 Z" fill="url(#redGrad)" />
      <text x="63" y="32" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">SYSTEM</text>
      <text x="63" y="46" fill="#4ade80" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600">ONLINE</text>
    </g>

    <!-- Floating Wrench Maintenance Tag Right -->
    <g transform="translate(360, 310)">
      <rect x="0" y="0" width="130" height="64" rx="12" fill="#18181b" stroke="#dc2626" stroke-width="1.5" />
      <circle cx="30" cy="32" r="16" fill="rgba(220, 38, 38, 0.2)" stroke="#dc2626" stroke-width="1.5" />
      <path d="M 25 37 L 35 27 M 27 25 L 29 27 M 33 33 L 35 35" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
      <text x="56" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">Unicare</text>
      <text x="56" y="42" fill="#a1a1aa" font-family="'Space Grotesk', sans-serif" font-size="9">Auto SVIET Lab</text>
    </g>
  </g>

  <!-- Glowing Pulsing Connection Nodes -->
  <circle cx="185" cy="190" r="4" fill="#dc2626" />
  <circle cx="410" cy="130" r="4" fill="#ef4444" />
  <circle cx="300" cy="140" r="5" fill="#4ade80" />
</svg>
