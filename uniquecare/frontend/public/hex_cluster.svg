<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Red Hexagon Top Left -->
  <polygon points="50,15 95,41 95,93 50,119 5,93 5,41" fill="#dc2626" />
  
  <!-- Outlined Charcoal Hexagon overlapping Top Left -->
  <polygon points="70,35 115,61 115,113 70,139 25,113 25,61" stroke="#52525b" stroke-width="3" fill="none" />

  <!-- White Outlined Hexagon upper right of cluster -->
  <polygon points="150,20 180,37 180,72 150,89 120,72 120,37" stroke="#71717a" stroke-width="2" stroke-opacity="0.6" fill="none" />

  <!-- Dark Slate Filled Hexagon -->
  <polygon points="130,75 148,85 148,107 130,117 112,107 112,85" fill="#3f3f46" />

  <!-- Small Red Outlined Hexagon -->
  <polygon points="160,85 180,97 180,119 160,131 140,119 140,97" stroke="#dc2626" stroke-width="2.5" fill="none" />

  <!-- Small Dark Grey Outlined Hexagon -->
  <polygon points="180,135 195,144 195,161 180,170 165,161 165,144" stroke="#52525b" stroke-width="2" fill="none" />

  <!-- Medium Red Outlined Hexagon Right -->
  <polygon points="185,170 215,187 215,222 185,239 155,222 155,187" stroke="#dc2626" stroke-width="3" fill="none" />

  <!-- Faint Outlined Hexagon far right -->
  <polygon points="200,245 220,256 220,279 200,290 180,279 180,256" stroke="#71717a" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Small Grey Outlined Hexagon lower center -->
  <polygon points="160,235 175,244 175,261 160,270 145,261 145,244" stroke="#52525b" stroke-width="2" fill="none" />

  <!-- Large Red Filled Hexagon Bottom -->
  <polygon points="135,240 180,266 180,318 135,344 90,318 90,266" fill="#dc2626" />
  
  <!-- Outlined Charcoal Hexagon overlapping Bottom -->
  <polygon points="145,260 190,286 190,338 145,364 100,338 100,286" stroke="#52525b" stroke-width="3" fill="none" />

  <!-- Medium Red Outlined Hexagon Bottom Left -->
  <polygon points="85,250 115,267 115,302 85,319 55,302 55,267" stroke="#dc2626" stroke-width="2.5" fill="none" />

  <!-- Dark Slate Filled Hexagon Left -->
  <polygon points="35,220 65,237 65,272 35,289 5,272 5,237" fill="#334155" />
  <polygon points="50,225 75,239 75,268 50,282 25,268 25,239" stroke="#dc2626" stroke-width="2" fill="none" />

  <!-- Small Outlined Hexagon middle left -->
  <polygon points="50,175 65,184 65,201 50,210 35,201 35,184" stroke="#52525b" stroke-width="2" fill="none" />

  <!-- Small Solid Red Hexagon Center Left -->
  <polygon points="80,170 95,179 95,196 80,205 65,196 65,179" fill="#dc2626" />

  <!-- Small Outlined Hexagon Center -->
  <polygon points="110,165 125,174 125,191 110,200 95,191 95,174" stroke="#52525b" stroke-width="2" fill="none" />

  <!-- Small Faint Hexagon Inner Ring -->
  <polygon points="110,135 122,142 122,156 110,163 98,156 98,142" stroke="#71717a" stroke-width="1.5" stroke-opacity="0.5" fill="none" />
  <polygon points="90,130 102,137 102,151 90,158 78,151 78,137" stroke="#dc2626" stroke-width="1.5" fill="none" />
</svg>
