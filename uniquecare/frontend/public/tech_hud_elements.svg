<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="none">
  <defs>
    <linearGradient id="hudRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Crosshair Target -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="30" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3" />
    <circle cx="0" cy="0" r="14" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5" />
    <line x1="-38" y1="0" x2="-20" y2="0" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="20" y1="0" x2="38" y2="0" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="-38" x2="0" y2="-20" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="20" x2="0" y2="38" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="2" fill="#ef4444" />
  </g>

  <!-- Telemetry Data Ticks -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="100" height="2" fill="url(#hudRed)" />
    <rect x="0" y="10" width="60" height="2" fill="url(#hudRed)" />
    <rect x="0" y="20" width="85" height="2" fill="url(#hudRed)" />
    <text x="0" y="42" fill="#71717a" font-family="monospace" font-size="9" letter-spacing="1">TELEMETRY // LIVE</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 20,20 L 45,20 M 20,20 L 20,45" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 480,20 L 455,20 M 480,20 L 480,45" stroke="#71717a" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 480,280 L 455,280 M 480,280 L 480,255" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 20,280 L 45,280 M 20,280 L 20,255" stroke="#71717a" stroke-width="2" stroke-opacity="0.3" />
</svg>
